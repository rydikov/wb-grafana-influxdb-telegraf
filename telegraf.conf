[agent]
  interval = "10s"
  flush_interval = "10s"

[[inputs.mqtt_consumer]]
  servers = ["tcp://localhost:1883"]

  topics = [
    "/devices/hwmon/controls/CPU Temperature"
  ]

  data_format = "value"
  data_type = "float"


[[outputs.influxdb]]
  urls = ["http://influxdb:8086"]
  database = "metrics"

  username = "admin"
  password = "changemeadminpassword"